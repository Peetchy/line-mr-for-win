summary = "LINE MR (ไลน์ไม่รู้) - ช่วยให้ใช้ LINE บน Windows ได้"
description = """ทำให้ผู้ใช้ NVDA ใช้ LINE บน Windows ได้ เช่น อ่านชื่อปุ่ม ช่องข้อความ และกล่องกาเครื่องหมายที่ไม่มีชื่อ อ่านรายการแชทและข้อความ (บอกประเภทของรูปภาพ วิดีโอ สติกเกอร์ ข้อความเสียง ไฟล์ ตำแหน่งที่ตั้ง และการโทร) กด Tab ไปถึงทุกปุ่ม และแจ้งสายเรียกเข้า โดยเพิ่มตัวเชื่อมการเข้าถึงขนาดเล็กไว้ในโฟลเดอร์ของ LINE (ไม่แก้ไขไฟล์ของ LINE) แนะนำให้ใช้ LINE จาก Microsoft Store (https://apps.microsoft.com/detail/XPFCC4CD725961)

คำสั่งใน LINE: Alt+1 / Alt+2 / Alt+3 แท็บเพื่อน / แชท / เพิ่มเพื่อน; Alt+C รายการแชท; Alt+L รายการแชทหรือรายชื่อเพื่อน; Alt+F ช่องค้นหา; Alt+M ข้อความของแชทที่เปิดอยู่; Alt+I ช่องพิมพ์ข้อความ; NVDA+Alt+1 ถึง 9 อ่านข้อความล่าสุด (1 = ใหม่สุด); NVDA+Shift+Control+L สถานะตัวเชื่อม
การโทร: ใน LINE กด Alt+A รับสายเรียกเข้า, Alt+D ปฏิเสธสายหรือวางสายที่กำลังคุยอยู่; จากทุกโปรแกรม กด NVDA+Shift+Control+A รับสาย, NVDA+Shift+Control+D ปฏิเสธหรือวางสาย
ปุ่มในรายการ: รายการแชท - ลูกศร Page Up/Down Home/End เลื่อนดูโดยไม่เปิดแชท Enter เปิดแชท; ข้อความ - ลูกศรขึ้น/ลง ทีละข้อความ Page Up/Down ทีละหน้าจอ Home ข้อความเก่าสุดที่โหลดแล้ว (กดอีกครั้งโหลดเก่าเพิ่ม) End ข้อความล่าสุด ปุ่ม Applications เมนูของข้อความ"""
