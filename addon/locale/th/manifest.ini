summary = "LINE MR (ไลน์ไม่รู้) - ช่วยให้ใช้ LINE บน Windows ได้"
description = """ทำให้ผู้ใช้ NVDA ใช้ LINE บน Windows ได้ เช่น อ่านชื่อปุ่ม ช่องข้อความ และกล่องกาเครื่องหมายที่ไม่มีชื่อ อ่านรายการแชทและข้อความ และเพิ่มคำสั่งแป้นพิมพ์ โดยเพิ่มตัวเชื่อมการเข้าถึงขนาดเล็กไว้ในโฟลเดอร์ของ LINE (ไม่แก้ไขไฟล์ของ LINE)"""
