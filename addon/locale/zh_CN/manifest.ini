summary = "LINE MR (Line Mai Roo) - LINE for Windows 无障碍"
description = """让 LINE for Windows 可以配合 NVDA 使用:为 LINE 没有名称的按钮、文本框和复选框提供名称,朗读聊天列表和消息(包括照片、视频、贴图、语音消息、文件、位置和通话的类型),让 Tab 能到达每个控件,并播报来电。在 LINE 的文件夹中加入一个小型无障碍桥接组件(不修改 LINE 的文件)。推荐使用 Microsoft Store 版 LINE (https://apps.microsoft.com/detail/XPFCC4CD725961)。

LINE 中的命令: Alt+1 / Alt+2 / Alt+3 好友 / 聊天 / 添加好友 标签; Alt+C 聊天列表; Alt+L 聊天列表或好友列表; Alt+F 搜索框; Alt+M 已打开聊天的消息; Alt+I 消息输入框; NVDA+Alt+1 到 9 朗读最近的消息 (1 = 最新); NVDA+Shift+Control+L 桥接组件状态。
通话: 在 LINE 中按 Alt+A 接听来电,Alt+D 拒绝或结束通话;在任何应用程序中按 NVDA+Shift+Control+A 接听,NVDA+Shift+Control+D 拒绝或结束通话。
列表中的按键: 聊天列表 - 方向键、Page Up/Down、Home/End 浏览而不打开聊天,回车打开聊天; 消息 - 上下方向键逐条移动,Page Up/Down 一屏,Home 已加载的最早消息 (再按加载更早的),End 最新消息,应用程序键打开消息菜单。"""
