name = lineMR
summary = "LINE MR (Line Mai Roo) - LINE for Windows accessibility"
description = """Makes LINE for Windows usable with NVDA: names LINE's unlabeled buttons, text fields and checkboxes, reads chat lists and messages (including what a photo, video, sticker, voice message, file, location or call is), makes every control reachable with Tab, and announces incoming calls. Adds a small accessibility bridge to LINE's folder (LINE's own files are not modified). Recommended: LINE from the Microsoft Store (https://apps.microsoft.com/detail/XPFCC4CD725961).

Commands in LINE: Alt+1 / Alt+2 / Alt+3 friends / chats / add friends tab; Alt+C chat list; Alt+L chat or friend list; Alt+M messages of the open chat; Alt+I message input; NVDA+Alt+1 to 9 read a recent message (1 = newest); NVDA+Shift+Control+L bridge status.
From any application: NVDA+Shift+Control+A answers an incoming LINE call, NVDA+Shift+Control+D declines it.
Keys in lists: chat list - arrows, Page Up/Down, Home/End browse without opening, Enter opens the chat; messages - Up/Down one message, Page Up/Down a screen, Home oldest loaded (again: older), End newest, Applications key the message's menu."""
author = "LINE MR project <peet.itsawat@gmail.com>"
url = https://github.com/Peetchy/line-mr-for-win
version = 0.4.4
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
