name = lineMR
summary = "LINE MR (Line Mai Roo) - LINE for Windows accessibility"
description = """Makes LINE for Windows usable with NVDA: names LINE's unlabeled buttons, text fields and checkboxes, reads chat lists and messages, and adds keyboard commands. Adds a small accessibility bridge to LINE's folder (LINE's own files are not modified). Recommended: LINE from the Microsoft Store (https://apps.microsoft.com/detail/XPFCC4CD725961)."""
author = "LINE MR project <peet.itsawat@gmail.com>"
