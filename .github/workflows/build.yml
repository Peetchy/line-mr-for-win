name: Build add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.6.3"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python tools
        run: python -m pip install aqtinstall markdown

      - name: Cache Qt SDK
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\Qt
          key: qt-${{ env.QT_VERSION }}-win64_msvc2019_64-qtbase-qtdeclarative

      - name: Install Qt SDK
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 --archives qtbase qtdeclarative --outputdir "${{ runner.temp }}\Qt"

      - name: Check add-on sources compile
        run: python -m compileall -q addon tools tests

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path addon/manifest.ini -Pattern '^version\s*=\s*(\S+)').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match manifest version $version" }
          "ADDON_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build bridge and add-on
        shell: pwsh
        run: tools/build.ps1 -QtDir "${{ runner.temp }}\Qt\${{ env.QT_VERSION }}\msvc2019_64" -Config Release

      - uses: actions/upload-artifact@v7
        with:
          name: lineMR-addon
          path: dist/*.nvda-addon
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $addon = Get-ChildItem dist/*.nvda-addon | Select-Object -First 1
          # What changed, the keyboard commands and the SHA-256
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          python tools/release_notes.py "${{ github.ref_name }}" $addon.FullName $notes
          # Same file under a fixed name: releases/latest/download/lineMR.nvda-addon (README link) always gets the newest
          $latest = Join-Path $env:RUNNER_TEMP "lineMR.nvda-addon"
          Copy-Item $addon.FullName $latest
          gh release create "${{ github.ref_name }}" $addon.FullName $latest --title "LINE MR ${{ env.ADDON_VERSION }}" --notes-file $notes --verify-tag
